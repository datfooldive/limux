name: Nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build flake
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE || 'limux' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build default package
        run: nix build --option sandbox false --print-build-logs "git+file://$PWD?submodules=1#default"

      - name: Check flake
        run: nix flake check --option sandbox false --print-build-logs "git+file://$PWD?submodules=1"
